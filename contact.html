<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacte amb Miquel Oliu, compositor. Consultes sobre partitures, encàrrecs i concerts.">
  <title>Miquel Oliu — Contacte</title>
  <script>
    try {
      var storedLang = localStorage.getItem('miqueloliu_lang');
      if (storedLang === 'es' || storedLang === 'en') document.documentElement.lang = storedLang;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="nav-container"></div>

  <main>
    <div class="contact-layout">
      <div class="page-header">
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.description"></p>
      </div>

      <div class="contact-grid">
        <!-- Direct Contact & Details Card -->
        <aside class="contact-card">
          <h2 class="contact-card-title" data-i18n="contact.card.title"></h2>

          <div class="contact-section">
            <p class="contact-label" data-i18n="contact.email.label"></p>
            <div class="email-box">
              <a href="mailto:mqoliu@gmail.com" class="contact-email-link">mqoliu@gmail.com</a>
              <button type="button" id="copy-email-btn" class="copy-btn" aria-label="Copy email address">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span id="copy-btn-text" data-i18n="contact.copy.button"></span>
              </button>
            </div>
            <div id="copy-toast" class="copy-toast" aria-live="polite"></div>
          </div>

          <div class="contact-section">
            <p class="contact-label" data-i18n="contact.location.label"></p>
            <p class="contact-value" data-i18n="contact.location.value"></p>
          </div>

          <div class="contact-section">
            <p class="contact-label" data-i18n="contact.publisher.label"></p>
            <p class="contact-value" data-i18n="contact.publisher.text"></p>
            <p class="contact-link-wrapper">
              <a href="https://www.ficta.cat" target="_blank" rel="noopener noreferrer" class="external-link">
                <span data-i18n="contact.publisher.link"></span> &rarr;
              </a>
            </p>
          </div>
        </aside>

        <!-- Interactive Contact Form -->
        <section class="contact-form-wrapper">
          <h2 class="contact-form-title" data-i18n="contact.form.title"></h2>
          
          <form id="contact-form" class="contact-form" action="#" method="post">
            <div class="form-group">
              <label for="contact-subject" data-i18n="contact.form.subject"></label>
              <select id="contact-subject" name="subject" required>
                <option value="" disabled selected data-i18n="contact.form.subject.select"></option>
                <option value="general" data-i18n="contact.form.subject.general"></option>
                <option value="score" data-i18n="contact.form.subject.score"></option>
                <option value="commission" data-i18n="contact.form.subject.commission"></option>
                <option value="other" data-i18n="contact.form.subject.other"></option>
              </select>
            </div>

            <div class="form-group">
              <label for="contact-message" data-i18n="contact.form.message"></label>
              <textarea id="contact-message" name="message" rows="5" required data-i18n-placeholder="contact.form.message.placeholder"></textarea>
            </div>

            <button type="submit" class="submit-btn">
              <span data-i18n="contact.form.send"></span>
            </button>
            
            <p class="form-notice" data-i18n="contact.form.notice"></p>
            <div id="form-status" class="form-status" aria-live="polite"></div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>

  <script>
    const PageInit = {
      contact: () => {
        const copyBtn = document.getElementById('copy-email-btn');
        const copyToast = document.getElementById('copy-toast');
        const contactForm = document.getElementById('contact-form');
        const formStatus = document.getElementById('form-status');

        if (copyBtn) {
          copyBtn.addEventListener('click', async () => {
            const email = 'mqoliu@gmail.com';
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(email);
              } else {
                const ta = document.createElement('textarea');
                ta.value = email;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
              }
              if (copyToast) {
                const currentLang = I18n.currentLang();
                const copiedMsg = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang]['contact.copy.copied']) || 'Copied!';
                copyToast.textContent = copiedMsg;
                copyToast.classList.add('show');
                setTimeout(() => copyToast.classList.remove('show'), 2500);
              }
            } catch (err) {
              console.error('Copy failed', err);
            }
          });
        }

        if (contactForm) {
          contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const subjectSelect = document.getElementById('contact-subject');
            const subjectText = subjectSelect.options[subjectSelect.selectedIndex] ? subjectSelect.options[subjectSelect.selectedIndex].text : '';
            const message = document.getElementById('contact-message').value.trim();

            const mailSubject = encodeURIComponent(`[Miquel Oliu Web] ${subjectText}`);
            const mailBody = encodeURIComponent(`Motiu: ${subjectText}\n\nMissatge:\n${message}`);

            window.location.href = `mailto:mqoliu@gmail.com?subject=${mailSubject}&body=${mailBody}`;

            if (formStatus) {
              const currentLang = I18n.currentLang();
              const successMsg = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang]['contact.form.success']) || 'Thank you!';
              formStatus.textContent = successMsg;
              formStatus.classList.add('show');
            }
          });
        }
      }
    };
  </script>
  <script src="js/main.js"></script>
</body>
</html>
