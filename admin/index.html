<!doctype html>
<html lang="ca">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="/admin/config.yml" type="text/yaml" rel="cms-config-url"><meta name="robots" content="noindex, nofollow"><title>Gestió del web · Miquel Oliu</title></head>
  <body>
    <script>
      if (window.crypto?.getRandomValues && !window.crypto.randomUUID) {
        Object.defineProperty(window.crypto, 'randomUUID', {
          value() {
            const bytes = window.crypto.getRandomValues(new Uint8Array(16));
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
            return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
          },
          configurable: true,
        });
      }
    </script>
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
  </body>
</html>
