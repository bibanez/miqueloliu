<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miquel Oliu — Premsa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="nav-container"></div>

  <main>
    <div class="page-header">
      <h1 data-i18n="press.title"></h1>
      <p data-i18n="press.description"></p>
    </div>

    <div id="press-content"></div>
  </main>

  <div id="footer-container"></div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data/press.js"></script>
  <script src="js/components.js"></script>

  <!-- Page-specific logic -->
  <script>
    const PageInit = {
      press: () => {
        const container = document.getElementById('press-content');
        const loc = v => I18n.fmt(I18n.loc(v));

        function render() {
          if (typeof PRESS === 'undefined' || PRESS.length === 0) {
            container.innerHTML = `<p class="empty-state" data-i18n="press.empty"></p>`;
            I18n.apply();
            return;
          }

          let html = '<div class="card-grid">';
          PRESS.forEach(row => {
            const link = row.url
              ? `<a href="${row.url}" target="_blank" rel="noopener">${loc(row.source) || 'Link'} &rarr;</a>`
              : `<span class="meta">${loc(row.source)}</span>`;
            html += `
              <div class="card">
                <h3>${loc(row.title)}</h3>
                <p class="meta">${row.date || ''}</p>
                <p>${loc(row.excerpt)}</p>
                ${link}
              </div>`;
          });
          html += '</div>';

          container.innerHTML = html;
          I18n.apply();
        }

        render();
        I18n.onChange(() => render());
      }
    };
  </script>

  <script src="js/main.js"></script>
</body>
</html>
