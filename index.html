<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lloc web oficial de Miquel Oliu, compositor.">
  <title>Miquel Oliu — Compositor</title>
  <script>
    // Evita un flaix del contingut en català quan l'idioma desat és un altre
    try {
      var storedLang = localStorage.getItem('miqueloliu_lang');
      if (storedLang === 'es' || storedLang === 'en') document.documentElement.lang = storedLang;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="nav-container"></div>

  <!-- Full-bleed hero: landscape photo with the composer's name -->
  <header class="home-hero">
    <img src="img/portada.jpg" alt="">
    <div class="home-hero-title">
      <h1>Miquel Oliu</h1>
      <p class="home-hero-subtitle" data-i18n="home.hero.subtitle"></p>
    </div>
  </header>

  <main class="home">
    <!-- Rilke quote -->
    <blockquote class="quote">
      <p data-i18n-html="home.quote.text"></p>
      <footer class="quote-attribution" data-i18n-html="home.quote.attribution"></footer>
    </blockquote>

    <div class="text-divider"></div>

    <!-- Three texts about his music -->
    <section class="testimonials">
      <p class="section-label" data-i18n="home.testimonials.label"></p>

      <div class="testimonial">
        <div class="testimonial-text" data-i18n-html="home.testimonial.humet.text"></div>
        <cite data-i18n="home.testimonial.humet.author"></cite>
      </div>

      <div class="text-divider"></div>

      <div class="testimonial">
        <div class="testimonial-text" data-i18n-html="home.testimonial.guix.text"></div>
        <cite data-i18n="home.testimonial.guix.author"></cite>
      </div>

      <div class="text-divider"></div>

      <div class="testimonial testimonial-poem">
        <div class="testimonial-text" data-i18n-html="home.testimonial.clapes.text" lang="ca"></div>
        <cite data-i18n="home.testimonial.clapes.author"></cite>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
