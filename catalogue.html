<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miquel Oliu — Obres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="nav-container"></div>

  <main>
    <div class="catalogue-layout">
      <div class="page-header">
        <h1 data-i18n="catalogue.title"></h1>
        <p data-i18n="catalogue.description"></p>
      </div>
      <nav class="catalogue-nav" id="catalogue-nav" aria-label="Categories"></nav>
      <div id="catalogue-content"></div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data/works.js"></script>
  <script src="js/data/work-info.js"></script>
  <!-- Orchestra seating functionality disabled for now (kept for future chamber music seating) -->
  <!-- <script src="js/orchestra.js"></script> -->
  <script src="js/components.js"></script>

  <!-- Page-specific logic -->
  <script>
    const PageInit = {
      catalogue: () => {
        const container = document.getElementById('catalogue-content');
        const quickNav = document.getElementById('catalogue-nav');
        const AUDIO_EXT = /\.(mp3|m4a|ogg|wav)(\?.*)?$/i;

        const loc = v => I18n.fmt(I18n.loc(v));

        // Open state of the parts fold (e.g. Llibre d'hores) is preserved across
        // language re-renders; populated in render() before renderWork runs.
        let openParts = new Set();

        function renderLinks(work, isPart) {
          const items = [];
          if (work.links && work.links.audio) {
            if (AUDIO_EXT.test(work.links.audio)) {
              // Self-hosted audio gets an inline player below the links row
              items.push(`<span class="work-link-label" data-i18n="works.link.audio"></span>`);
            } else {
              items.push(`<a href="${work.links.audio}" target="_blank" rel="noopener" data-i18n="works.link.audio"></a>`);
            }
          }
          if (work.links && work.links.score) {
            items.push(`<a href="${work.links.score}" target="_blank" rel="noopener" data-i18n="works.link.score"></a>`);
          }
          if (work.note) {
            items.push(`<button class="work-note-toggle" data-target="note-${work.id}" data-i18n="works.link.note"></button>`);
          }
          const info = typeof WORK_INFO !== 'undefined'
            ? WORK_INFO[work.id]
            : (work.links && work.links.info ? {
              href: work.links.info,
              hasSiteLanguage: true,
            } : null);
          if (!isPart) {
            if (info && info.hasSiteLanguage) {
              items.push(`<a href="${info.href}" data-i18n="works.link.info"></a>`);
            } else {
              items.push(`<span class="work-link-disabled" aria-disabled="true" data-i18n="works.link.info"></span>`);
            }
          }

          let html = '';
          if (items.length) {
            html += `<p class="work-links">${items.join('<span class="work-link-sep">·</span>')}</p>`;
          }
          if (work.links && work.links.audio && AUDIO_EXT.test(work.links.audio)) {
            html += `<audio class="work-audio" controls preload="none" src="${work.links.audio}"></audio>`;
          }
          if (work.note) {
            html += `<div class="work-note" id="note-${work.id}" hidden>${loc(work.note)}</div>`;
          }
          return html;
        }

        function renderWork(work, isPart) {
          const years = work.years ? ` <span class="work-years">(${work.years})</span>` : '';
          const titleTag = isPart ? 'h4' : 'h3';
          let html = `<article class="work${isPart ? ' work-part' : ''}" id="work-${work.id}">`;
          html += `<${titleTag} class="work-title">${loc(work.title)}${years}</${titleTag}>`;

          if (work.subtitle)        html += `<p class="work-subtitle">${loc(work.subtitle)}</p>`;
          if (work.instrumentation) {
            /*
            // Seating chart toggle disabled for now (kept for future chamber music seating)
            const raw = I18n.loc(work.instrumentation);
            const orch = Orchestra.parse(raw);
            if (orch) {
              html += `<p class="work-instrumentation"><button class="work-orchestra-toggle" data-target="orch-${work.id}" aria-controls="orch-${work.id}" aria-expanded="false">${raw}<span class="orchestra-hint" data-i18n="works.orchestra.hint"></span></button></p>`;
              html += `<div class="orchestra-panel" id="orch-${work.id}" data-formula="${raw}" hidden></div>`;
            } else {
              html += `<p class="work-instrumentation">${loc(work.instrumentation)}</p>`;
            }
            */
            html += `<p class="work-instrumentation">${loc(work.instrumentation)}</p>`;
          }
          if (work.movements) {
            html += `<ul class="work-movements">${work.movements.map(m => `<li>${loc(m)}</li>`).join('')}</ul>`;
          }
          if (work.duration)        html += `<p class="work-duration">${loc(work.duration)}</p>`;
          (work.details || []).forEach(d => { html += `<p class="work-detail">${loc(d)}</p>`; });

          // Disponibilitat de la partitura: editada per Ficta o sota demanda
          if (work.score) {
            const scoreValue = work.score === 'contact'
              ? `<a href="contact.html" data-i18n="works.score.contact"></a>`
              : `<span data-i18n="works.score.ficta"></span>`;
            html += `<p class="work-detail work-score"><span data-i18n="works.score.label"></span> ${scoreValue}</p>`;
          }

          html += renderLinks(work, isPart);

          // Sub-pieces (quaderns/volums) folded under a collapsible toggle
          if (work.parts && work.parts.length) {
            const partsId = `parts-${work.id}`;
            html += `<details class="work-parts" id="${partsId}"${openParts.has(partsId) ? ' open' : ''}>`;
            html += `<summary class="work-parts-summary"><span data-i18n="works.parts.show"></span></summary>`;
            work.parts.forEach(p => { html += renderWork(p, true); });
            html += '</details>';
          }

          html += '</article>';
          return html;
        }

        let isManualClicking = false;
        let clickTimer = null;

        function setActiveTab(currentId) {
          let activeTab = null;
          quickNav.querySelectorAll('a').forEach(a => {
            const isActive = a.getAttribute('href') === '#' + currentId;
            a.classList.toggle('active', isActive);
            if (isActive) activeTab = a;
          });

          if (activeTab && quickNav.scrollWidth > quickNav.clientWidth) {
            activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          }
        }

        function renderNav() {
          quickNav.innerHTML = WORKS.map(c =>
            `<a href="#${c.id}">${I18n.loc(c.name)}</a>`
          ).join('');

          quickNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
              e.preventDefault();
              const targetId = link.getAttribute('href').slice(1);
              const targetEl = document.getElementById(targetId);

              if (targetEl) {
                isManualClicking = true;
                clearTimeout(clickTimer);
                setActiveTab(targetId);

                targetEl.scrollIntoView({ behavior: 'smooth' });

                clickTimer = setTimeout(() => {
                  isManualClicking = false;
                }, 1000);
              }
            });
          });

          updateActiveLink();
        }

        function updateActiveLink() {
          if (isManualClicking) return;

          const scrollPos = window.scrollY || window.pageYOffset;
          const windowHeight = window.innerHeight;
          const docHeight = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          );

          // Activa la darrera categoria quan s'arriba a la part inferior de la pàgina
          if (scrollPos + windowHeight >= docHeight - 150 && WORKS.length > 0) {
            setActiveTab(WORKS[WORKS.length - 1].id);
            return;
          }

          const siteNav = document.querySelector('#nav-container nav');
          const navHeight = siteNav ? siteNav.offsetHeight : 72;
          const offset = navHeight + 115;

          let current = WORKS.length ? WORKS[0].id : null;
          WORKS.forEach(c => {
            const section = document.getElementById(c.id);
            if (section) {
              const top = section.getBoundingClientRect().top;
              if (top <= offset) current = c.id;
            }
          });

          setActiveTab(current);
        }

        function render() {
          if (typeof WORKS === 'undefined' || WORKS.length === 0) {
            container.innerHTML = `<p class="empty-state" data-i18n="catalogue.empty"></p>`;
            I18n.apply();
            return;
          }

          // Conserva l'estat de les sub-peces entre re-renderitzats (canvi d'idioma)
          /*
          // Panells d'orquestra desactivats provisionalment (guardats per a música de cambra)
          const openOrch = new Set(
            [...container.querySelectorAll('.orchestra-panel:not([hidden])')].map(p => p.id)
          );
          */
          openParts = new Set(
            [...container.querySelectorAll('details.work-parts[open]')].map(d => d.id)
          );

          let html = '';
          WORKS.forEach(category => {
            html += `<section class="works-category" id="${category.id}">`;
            html += `<h2 class="works-category-title">${I18n.loc(category.name)}</h2>`;
            category.works.forEach(work => { html += renderWork(work, false); });
            html += '</section>';
          });

          container.innerHTML = html;
          renderNav();
          I18n.apply();

          // The catalogue is rendered after the browser processes the URL
          // fragment, so restore the requested work anchor once its DOM exists.
          if (window.location.hash) {
            const target = document.getElementById(window.location.hash.slice(1));
            if (target) {
              setTimeout(() => target.scrollIntoView({ block: 'start' }), 0);
            }
          }

          container.querySelectorAll('.work-note-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
              const note = document.getElementById(btn.dataset.target);
              if (note) note.hidden = !note.hidden;
            });
          });

          /*
          // Event listeners per al desplegable d'orquestra (desactivats provisionalment, guardats per a música de cambra)
          container.querySelectorAll('.work-orchestra-toggle').forEach(btn => {
            const panel = document.getElementById(btn.dataset.target);
            if (!panel) return;
            // El diagrama es construeix la primera vegada que s'obre el panell
            const fillPanel = () => {
              if (panel.firstChild) return;
              const orch = Orchestra.parse(panel.dataset.formula);
              if (!orch) return;
              panel.innerHTML = Orchestra.renderPanel(orch);
              Orchestra.bind(panel);  // sincronització de l'hover — necessita el contingut
            };
            const setOpen = (open, animate) => {
              if (open) fillPanel();
              panel.hidden = !open;
              if (open && animate) panel.classList.add('is-opening');
              btn.setAttribute('aria-expanded', String(open));
            };
            if (openOrch.has(panel.id)) setOpen(true, false);  // language re-render: refill in new language, no replay
            btn.addEventListener('click', () => setOpen(panel.hidden, true));
          });
          */
        }

        render();
        I18n.onChange(() => render());
        window.addEventListener('scroll', updateActiveLink, { passive: true });
      }
    };
  </script>

  <script src="js/main.js"></script>
</body>
</html>
