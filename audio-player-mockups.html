<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miquel Oliu — Estudis de reproductor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav-container"></div>

  <main data-page="recording-mockups">
    <div class="recording-mockups-layout">
      <div class="page-header">
        <h1 data-i18n="recording.mockups.title"></h1>
        <p data-i18n="recording.mockups.description"></p>
      </div>

      <section class="recording-mockup-stack" aria-label="Audio player mockups">
        <article class="recording-mockup-study">
          <p class="recording-mockup-label" data-i18n="recording.mockups.editorial"></p>
          <div data-recording-mockup data-recording-variant="editorial"></div>
        </article>
        <article class="recording-mockup-study">
          <p class="recording-mockup-label" data-i18n="recording.mockups.waveform"></p>
          <div data-recording-mockup data-recording-variant="waveform"></div>
        </article>
        <article class="recording-mockup-study">
          <p class="recording-mockup-label" data-i18n="recording.mockups.compact"></p>
          <div data-recording-mockup data-recording-variant="compact"></div>
        </article>
      </section>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data/works.js"></script>
  <script src="js/recording-player.js"></script>
  <script src="js/components.js"></script>
  <script src="js/recording-mockups.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
